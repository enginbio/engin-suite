[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engin-graph"
version = "0.1.0"
description = "Graph embedding + calibrated ranking over structured objects — the shared graph engine of the engin suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EnginBio" }]
keywords = ["graph-neural-network", "ranking", "conformal-prediction", "synthetic-biology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Light path: networkx graphs, numpy/sklearn for the head, engin-core for the shared
# conformal calibration. No PyTorch — the trained-GNN upgrade goes behind an extra.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",  # >=1.4 not >=1.3: mapie 1.0 requires it, so 1.3 was never installable
    "networkx>=3.0",
    "engin-core>=0.1.0",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.6"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Run from a bare checkout without relying on an editable install: this package's
# own src plus the sibling engin-core it imports. pytest resolves these relative
# to rootdir, and .pth-provided paths are not visible during a pytest run.
pythonpath = ["src", "../engin-core/src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

# READMEs contain hand-aligned example code; formatting them would collapse the
# alignment that makes the examples scan. Code is formatted, docs are not.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "N806"]
