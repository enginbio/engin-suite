[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engin-core"
version = "0.1.1"
description = "Open bioprocess forecasting + calibration toolkit for fermentation scale-up"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EnginBio" }]
keywords = ["bioprocess", "fermentation", "gaussian-process", "conformal", "bayesian-optimization", "synthetic-biology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Mature, well-tested libraries for the solved wheels (integration, GP, conformal);
# only the domain models (bioreactor equations, recommender) are hand-written.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",  # >=1.4 not >=1.3: mapie 1.0 requires it, so 1.3 was never installable
    "mapie>=1.0",
    "pydantic>=2.0",       # typed inter-stage handoff contracts (engin_core.handoff)
]

[project.optional-dependencies]
examples = ["matplotlib>=3.6"]
# The project-file reader (engin_core.config) and the per-stage console scripts.
# YAML rather than JSON because the starter file teaches through its comments, and
# a format that cannot carry them would defeat the point. Optional so the modelling
# path stays light (ADR 0002).
cli = ["pyyaml>=6.0"]
# BioSTEAM-backed techno-economics. Optional because BioSTEAM requires Python >= 3.12
# while this package supports 3.10+, and pulls ~40 transitive dependencies including
# numba and thermo. Keeping it out of the default install preserves the light path.
#
#   **On macOS x86_64 this extra does not install at all, and the marker below does
#   not express that.** BioSTEAM needs numba, numba needs llvmlite, and llvmlite
#   ships macOS wheels for `arm64` only -- checked against llvmlite 0.49.0 on
#   2026-08-20, which publishes `macosx_12_0_arm64` for cp310 through cp314 and no
#   `macosx_*_x86_64` wheel at any version. pip therefore tries to build llvmlite
#   from source, which needs a matching LLVM toolchain and fails on a stock machine.
#
#   Same shape as the `bo` note below, and recorded for the same reason: the failure
#   surfaces as a wheel build error deep in a dependency chain, which costs an
#   afternoon to trace back to "this platform, not your setup". An Apple-silicon Mac
#   or any Linux is fine. Found while attempting the BioSTEAM baseline for #20.
tea = ["biosteam>=2.51; python_version >= '3.12'"]
# The off-the-shelf Bayesian-optimization baseline (#20). Optional for a reason
# that is sharper than "torch is heavy":
#
#   On macOS x86_64 torch has **no current wheel at all** -- the last release
#   carrying one is 2.2.2, and 2.3.0 onward ships zero. So on that platform BayBE
#   installs only against a two-year-old torch, which in turn predates the numpy 2
#   ABI and raises "RuntimeError: Numpy is not available" until numpy is held
#   below 2. A default dependency here would make this package unbuildable on such
#   a machine at any current version.
#
# BayBE rather than Ax (Apache-2.0 matches D3, and its floor is >=3.10 against
# Ax's >=3.11) and rather than ProcessOptimizer, which docs/ecosystem.md offers as
# the torch-free alternative and which pulls torch too -- see #191.
bo = ["baybe>=0.13; python_version >= '3.10'"]
# The D11 data convention (engin_core.convention). Optional because the modelling
# path needs none of it: the convention is the entry point for people bringing
# their own data, not for the core loop, and keeping xarray and pandas out of the
# default install preserves the light path. pint is what turns a units attribute
# from a comment into a checkable claim.
io = ["xarray>=2023.1", "pandas>=2.0", "pint>=0.22"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.6", "xarray>=2023.1", "pandas>=2.0", "pint>=0.22", "pyyaml>=6.0"]

[project.scripts]
# Per-stage script, not `engin <stage>`: see #141.
engin-process = "engin_core.cli:main"

[project.urls]
Homepage = "https://github.com/enginbio/engin-suite"
Documentation = "https://docs.engin.bio"
Repository = "https://github.com/enginbio/engin-suite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Run from a bare checkout without relying on an editable install.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples", "benchmarks"]

# READMEs contain hand-aligned example code; formatting them would collapse the
# alignment that makes the examples scan. Code is formatted, docs are not.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# GP/kernel math reads best with conventional capitalized matrix names (K, X, L).
ignore = ["E741", "N806"]
