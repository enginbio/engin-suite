[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engin-core"
version = "0.1.0"
description = "Open bioprocess forecasting + calibration toolkit for fermentation scale-up"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EnginBio" }]
keywords = ["bioprocess", "fermentation", "gaussian-process", "conformal", "bayesian-optimization", "synthetic-biology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Mature, well-tested libraries for the solved wheels (integration, GP, conformal);
# only the domain models (bioreactor equations, recommender) are hand-written.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",  # >=1.4 not >=1.3: mapie 1.0 requires it, so 1.3 was never installable
    "mapie>=1.0",
    "pydantic>=2.0",       # typed inter-stage handoff contracts (engin_core.handoff)
]

[project.optional-dependencies]
examples = ["matplotlib>=3.6"]
# BioSTEAM-backed techno-economics. Optional because BioSTEAM requires Python >= 3.12
# while this package supports 3.10+, and pulls ~40 transitive dependencies including
# numba and thermo. Keeping it out of the default install preserves the light path.
tea = ["biosteam>=2.51; python_version >= '3.12'"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/enginbio/engin-suite"
Documentation = "https://docs.engin.bio"
Repository = "https://github.com/enginbio/engin-suite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Run from a bare checkout without relying on an editable install.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples", "benchmarks"]

# READMEs contain hand-aligned example code; formatting them would collapse the
# alignment that makes the examples scan. Code is formatted, docs are not.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# GP/kernel math reads best with conventional capitalized matrix names (K, X, L).
ignore = ["E741", "N806"]
