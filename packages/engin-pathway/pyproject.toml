[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engin-pathway"
version = "0.1.0"
description = "Manufacturability ranking of metabolic routes — stage [3] of the engin strain-to-scale suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EnginBio" }]
keywords = ["metabolic-pathway", "strain-design", "graph-ml", "synthetic-biology", "bioprocess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# M0 light path: networkx (route graphs), scikit-learn (ridge head + metrics),
# scipy (rank stats), pydantic (schemas), engin-core (shared conformal vocabulary).
# The trainable PyG GNN + COBRApy/eQuilibrator real routes are the M1 upgrade.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.4",  # >=1.4 not >=1.3: mapie 1.0 requires it, so 1.3 was never installable
    "networkx>=3.0",
    "pydantic>=2.0",
    "engin-core>=0.1.0",
    "engin-graph>=0.1.0",
]

[project.scripts]
# Per-stage script, not `engin <stage>`: see #141.
engin-pathway = "engin_pathway.cli:main"

[project.urls]
Homepage = "https://github.com/enginbio/engin-suite"
Documentation = "https://docs.engin.bio"
Repository = "https://github.com/enginbio/engin-suite"

[project.optional-dependencies]
examples = ["matplotlib>=3.6"]
# The `engin-pathway` console script; the project-file reader lives in engin-core.
cli = ["engin-core[cli]"]
# Reaction thermodynamics for `g_thermo` (#140), via eQuilibrator -- which `D9`
# names explicitly as something to compose with rather than rebuild. Optional for
# two measured reasons rather than taste:
#
#   * it requires Python >= 3.11 (equilibrator-api, component-contribution and
#     equilibrator-cache all do) while this package supports >= 3.10, so the
#     marker keeps resolution working on 3.10 instead of breaking it;
#   * its first call downloads a compound database from Zenodo. Measured rather
#     than quoted: the file is **1.34 GB** and `ComponentContribution()` took
#     **86 s** on a fast connection. The upstream tutorial says "about ten
#     minutes", which is a bandwidth-dependent number; the size is the durable
#     one and is the reason this cannot be a default install or a CI step.
#
# Neither makes it a bad dependency; both make it a bad *default* one. Same shape
# as engin-core's [tea] extra for BioSTEAM. The transform in thermo.py needs none
# of this -- it is a pure function of a number you can get any way you like.
thermo = ["equilibrator-api>=0.7; python_version >= '3.11'"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.6", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
# Network tests are opt-in: `pytest -m network`. CI must not depend on
# rhea-db.org being reachable -- a suite that goes red because someone else's
# server is down teaches people to ignore red.
markers = ["network: hits an external service (Rhea); deselected by default"]
# Run from a bare checkout without relying on an editable install: this package's
# own src plus the sibling engin-core it imports. pytest resolves these relative
# to rootdir, and .pth-provided paths are not visible during a pytest run.
pythonpath = ["src", "../engin-core/src", "../engin-graph/src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

# READMEs contain hand-aligned example code; formatting them would collapse the
# alignment that makes the examples scan. Code is formatted, docs are not.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "N806"]
