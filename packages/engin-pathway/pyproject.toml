[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engin-pathway"
version = "0.1.0"
description = "Manufacturability ranking of metabolic routes — stage [3] of the engin strain-to-scale suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EnginBio" }]
keywords = ["metabolic-pathway", "strain-design", "graph-ml", "synthetic-biology", "bioprocess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# M0 light path: networkx (route graphs), scikit-learn (ridge head + metrics),
# scipy (rank stats), pydantic (schemas), engin-core (shared conformal vocabulary).
# The trainable PyG GNN + COBRApy/eQuilibrator real routes are the M1 upgrade.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "pydantic>=2.0",
    "engin-core>=0.1.0",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.6"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "N806"]
