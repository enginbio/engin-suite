[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engin-host"
version = "0.1.0"
description = "Host/chassis selection with calibrated confidence — stage [4] of the engin strain-to-scale suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EnginBio" }]
keywords = ["chassis", "host-selection", "mcda", "synthetic-biology", "bioprocess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Light path: pydantic for schemas, numpy for the (small) MCDA math, engin-core
# for the shared uncertainty primitives (P(score >= threshold), future conformal).
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "engin-core>=0.1.0",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.6"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Run from a bare checkout without relying on an editable install: this package's
# own src plus the sibling engin-core it imports. pytest resolves these relative
# to rootdir, and .pth-provided paths are not visible during a pytest run.
pythonpath = ["src", "../engin-core/src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "N806"]
