  # heaviest evidence burden on exactly this shape of sentence, and the document
  # making it was absent from this register as a `doc:` key.

  - doc: docs/limitations.md
    tier: A
    source_id: 2025-jbei-isoprenol-crispri
    claim: >-
      "No public corpus of process-condition DoE data with absolute titers
      exists" — this campaign is public, multi-cycle, ART-guided and reports
      absolute isoprenol titer in mg/L, so it falsifies the absolute-titer half.
      It does not falsify the claim, because its designed variation is sgRNA
      combinations over gene targets rather than the process knobs Engin takes
      (feed_rate, feed_start, Sf, induction_time, S0).
    strength: contradicts
    reviewed: 2026-08-16
    note: >-
      Recorded as `contradicts` rather than `supports` deliberately. It does not
      overturn the narrowed sentence, but it does overturn the *older* wording
      ("in-domain microbial DoE"), and a near-miss filed as supporting evidence is
      how an absence claim quietly stops being checked.

