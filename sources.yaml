  - doc: packages/engin-pathway/README.md
    tier: A
    source_id: 2021-jiang-gnn-vs-descriptors
    claim: >-
      "Beats step-count" (Spearman 0.85 vs 0.51, ~9x lower regret) — offered as
      a property of the ranking method.
    strength: contradicts
    reviewed: 2026-08-15
    note: >-
      **The second instance of #88's failure mode, found by looking for it.**
      `make_dataset` produces both the routes and their labels, and
      `simulate.py:37` builds the label as
      `(0.6*worst_step + 0.4*mean_step) * 0.96**(length-2)`. Step-count sees only
      `length`, so its score is a fixed property of the generator rather than a
      result: over 2000 routes the worst-step term carries r2 0.81 of the label
      and the length term 0.12, capping any length-only heuristic at rho ~0.41.

      Decisive rather than suggestive: relabel the *same* routes with the length
      base at 0.70 instead of 0.96 and step-count rises to rho 0.95 while the
      worst-step signal falls to 0.31. The ranking flips with nothing about
      either method changed, so the margin measures the constants.
      `packages/engin-pathway/benchmarks/generator_audit.py` reproduces it.

      What survives is narrow and real: the graph model does recover a worst-step
      signal a length heuristic is blind to. Jiang et al. is the same caution #88
      cites -- across 11 datasets and 8 algorithms, descriptor-based models
      generally outperform graph-based ones, so a graph model earning its keep is
      the exception rather than the default. Whether real routes are worst-step
      dominated is untested; it is a stated design assumption of the generator,
      and M1's KEGG/MetaCyc/BiGG routes are what would test it.

# One row per major code component. `stance: unaudited` is the honest default
# and is what the D23 programme exists to reduce — see issues #84 to #90.
components:
  - component: Gaussian-process titer forecast
    package: engin-core
    stance: standard
    standard_impl: scikit-learn GaussianProcessRegressor
    evidence: [2011-pedregosa-scikit-learn]
    adr: adr/0002-light-default-dependency-path
    reviewed: 2026-08-13
    note: >-
      scikit-learn is the standard general-purpose ML library, and that is what
      the citation supports. It is *not* the standard for GPs specifically --
      GPyTorch and GPy are the specialist implementations, and a scalable or
      deep-kernel GP would use one of them. The stance is `standard` because
      ADR 0002 chose the light dependency path deliberately, not because
      sklearn's GP is the field's best GP.

  - component: Split-conformal calibration
    package: engin-core
    stance: wrapped
    standard_impl: MAPIE (cross-check) + sd-normalized multiplier
    evidence: [2022-taquet-mapie]
    adr: null
    reviewed: 2026-08-15
    note: >-
      MAPIE is the widely-used Python conformal library and is kept here as an
      independent cross-check, not as the default -- it is deliberately a
      *different* method (constant-width), which is the point of a cross-check.
      Recorded absence: MAPIE has a preprint and no peer-reviewed publication.
      The underlying method's grounding is #86, a separate question from the
      library's.

      **Version recorded 2026-08-15 (#127), which it should have carried from the
      start.** Evaluated against **mapie 1.5.0**; engin-core declares
      `mapie>=1.0`. That matters more here than the row admitted: MAPIE 1.x
      renamed the regressor API, so this row was evidencing a cross-check against
      a 2022 preprint describing a surface that has since changed. The pymcdm and
      scikit-criteria rows set the right standard -- "evaluated at 1.4.0; the
      version is recorded because the answer can change" -- and this row did not
      meet it.

      Re-checked and holding: the peer-review absence is still true, and arXiv
      2207.12274 is still the reference.

  - component: Data convention over xarray/pandas
    package: engin-core
    stance: bespoke-justified
    standard_impl: MIFE / MIFD (metadata layer)
    evidence: [2026-cf-xarray-units, 2026-georgakilas-mife-mifd, 2026-amigo-prefer]
    adr: null
    reviewed: 2026-08-14
    note: >-
      **`standard_impl: none exists` was false, and this project's own decision
      record already said so.** MIFE and MIFD -- minimum information for
      fermentation experiments and devices -- are peer-reviewed (GigaScience 2026),
      LinkML-schema'd, deposited in BioPortal and integrated with FAIR Data
      Station. The vault's D11 entry names them and resolves to *adopt rather than
      compete*, on the reasoning that where a standard exists the durable position
      is the reference implementation. The public register meanwhile claimed the
      slot was empty.

      **Resolved 2026-08-13**: `convention.MIFE_SLOTS` maps all 17 channels to a
      MIFE slot (9) or a documented gap (8), with tests failing if a channel is
      added without a verdict. The boundary is real rather than convenient -- MIFE
      specifies controlled conditions and provenance; this convention adds measured
      and derived series, and MIFE defines no slot for OUR, CER, RQ, kLa, mu,
      cultivation biomass or exhaust composition. Those are exactly the channels a
      real industrial export forced in and a simulator never needed. Generating the
      data model from the LinkML spec remains outstanding; see
      docs/design/data-convention.md.

      **Re-searched 2026-08-14 (#115).** PREFER, a BFO-aligned precision-fermentation
      ontology out of DTU and UCSD, published 2026-02-18 -- six months before the
      search above ran, and missed by it. Verdict `monitor`: a different layer
      (semantics, not a minimum-information checklist), no adoption evidence yet. It
      does not cite MIFE/MIFD, which is the fragmentation D11 named, and is the
      finding to report upstream. The re-check is pulled in to 2027-02; whether
      annual is the wrong cadence for standards claims generally is D23's call.

  - component: Ingest layer / schema inference
    package: engin-core
    stance: bespoke-justified
    standard_impl: none exists for the inference step; MIFE/MIFD is the target vocabulary
    evidence:
    - 2026-frictionless-detector
    - 2026-georgakilas-mife-mifd
    - 2026-jubiotech-detl
    - 2022-osthege-bletl
    - 2026-benchling-allotropy
    adr: null
    reviewed: 2026-08-14
    note: >-
      The absence survives here, but narrower than it was stated. Nothing
      published maps arbitrary vendor bioreactor exports onto a domain vocabulary
      -- frictionless infers *types*, not semantics, which is why it was rejected.
      What changed on 2026-08-13 is the other end: **the vocabulary to map onto is
      no longer ours to invent.** MIFE/MIFD supplies it, so the honest description
      of this component is a mapper into a published standard rather than a
      standard-shaped gap.

      **Searched on the parser side 2026-08-14 (#116); it had never been.** Every
      prior row was schema-side, on the component D11 calls "the real
      contribution". Three candidates now recorded: detl (DASGIP/DASware, no
      vocabulary layer, AGPL-3.0), bletl (BioLector, same shape, AGPL-3.0,
      peer-reviewed) and allotropy (the architecture, MIT, ~60 parsers, zero for
      bioreactors). None meets both conjuncts, so the claim holds -- but the
      finding is not the absence. **The niche is abandoned in place rather than
      empty**: two single-vendor parsers, 8 stars each, both in maintenance mode.
      Nobody funds the cross-vendor mapper. D9 does not require composing with
      detl or bletl, since AGPL-3.0 against Apache-2.0 (D3) rules it out on any
      terms; saying so beats leaving it ambiguous.

      **The stance stays `bespoke-justified`, and it costs more to hold than it
      did.** detl's fixtures are the files loaders.py said nobody had, so the
      layer was measured against a real export for the first time: 1 of 40
      columns mapped, that one a false positive, and register_alias -- the
      documented escape hatch -- does not reach the file. See
      docs/methods/vendor-export-ingest.md. The absence is still real; the
      implementation is further from filling it than the register implied.

