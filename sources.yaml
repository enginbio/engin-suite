# Engin evidence register (public half) — implements D23.
#
# Source of truth. Every markdown view is generated from this file:
#   python scripts/evidence/render.py            # writes docs/references.md
#   python scripts/evidence/render.py --check    # CI: fails if the view is stale
#
# The private half is sources.vault.yaml in the vault, holding Tier B/C rows only
# and sharing this id namespace. **A public citation must never resolve to a
# private path**; render.py enforces that rather than trusting it.
#
# `strength: contradicts` and `superseded` rows are the point of the exercise,
# not a failure of it. They become edits to the document, and the row stays as
# the record of the correction.

