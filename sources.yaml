  - doc: packages/engin-core/src/engin_core/gp.py
    tier: A
    source_id: 2012-vovk-conditional-validity
    claim: >-
      Coverage conditional on the calibration set is Beta(n + 1 - l, l) with
      l = floor((n+1) * alpha) — so the nominal level is the *mean* of a
      distribution, not the coverage any one calibration set delivers.
      `conformal_coverage_interval` computes exactly this.
    strength: supports
    reviewed: 2026-08-17
    note: >-
      The paper read was the PMLR/ACML version, where the PAC-type statement is
      Proposition 2a: the predictor is (E, delta)-valid for
      E >= epsilon + sqrt(-ln(delta) / 2n), with the recipe requiring the
      calibration set to significantly exceed N = -ln(delta) / (2 epsilon^2).
      That bound is Hoeffding-based and conservative — at epsilon=0.10,
      delta=0.05 it demands n well above 150 before a 90% interval is
      training-conditionally trustworthy. The exact Beta result is the tighter
      and more useful of the two, so it is what the code implements; the
      Proposition 2a bound is recorded here because it is the same paper's answer
      to the same question and a reader who finds it should not think we missed it.

