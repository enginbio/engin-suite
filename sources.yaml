      needs for a fixture, and the integrator is already scipy's `solve_ivp`
      rather than a hand-rolled RK4 -- the part that genuinely should not be
      reinvented is not. **Revisit the moment a user's own kinetics need to go in:
      at that point SBML import stops being overhead and starts being the
      feature.**

  - component: Expected-improvement recommender
    package: engin-core
    stance: bespoke-justified
    standard_impl: BoTorch / Ax / BayBE
    evidence: [2020-balandat-botorch]
    adr: adr/0002-light-default-dependency-path
    reviewed: 2026-08-13
    note: >-
      Reclassified from `unaudited`. BoTorch is the reference implementation for
      Monte-Carlo BO and BayBE is a well-built Apache-2.0 campaign layer
      (verified 2026-08-13: Apache-2.0, maintained by Merck KGaA, 0.15.0 released
      2026-06-11). Engin ships a thin analytic EI on its own GP instead, and the
      justification is ADR 0002 -- adopting BoTorch drags PyTorch into the
      default install. That is a dependency-weight argument, not a claim to a
      better acquisition function, and it should never be written as one.

  - component: Host-capability knowledge base and scoring
    package: engin-host
    stance: bespoke-justified
    standard_impl: pymcdm / scikit-criteria (weighted-sum MCDA)
    evidence: [2026-pymcdm-methods, 2026-scikit-criteria]
    adr: null
    reviewed: 2026-08-13
    note: >-
      **The one row this audit could not clear, and it is filed as such.**
      `standard_impl: unknown` was not true. `scoring.py` is a weighted-sum
      multi-criteria decision analysis with linear error propagation -- a named
      method in a mature field, with maintained Python implementations (pymcdm
      1.4.0, scikit-criteria 0.10, both verified on PyPI 2026-08-13). Neither was
      evaluated before this was written, and D9's rule that "the rejection needs
      evidence too" was not met.

      The knowledge base and its capability semantics are genuinely bespoke
      domain content and were never in question. What was in question is the ~40
      lines of scoring arithmetic on top.

      **Resolved 2026-08-13 by running the evaluation (#103), not by arguing it.**
      pymcdm 1.4.0 and scikit-criteria 0.10 were installed and inspected: both
      take point-valued decision matrices, neither propagates a per-criterion
      standard deviation, and neither has any feasibility or constraint concept.
      Both of this component's requirements are unmet, so the row moves to
      `bespoke-justified` -- see the two claim rows above for what was run.

      Note what the evaluation did *not* vindicate: the weighted sum itself is a
      commodity and both libraries provide it. It is also one line of numpy. The
      justification rests entirely on the uncertainty propagation and the
      demotion, and if either library gains interval-valued or stochastic inputs
      this should be revisited rather than assumed settled.

