  - id: 2025-pham-cqr-bioprocess-robust-optimisation
    title: >-
      Single-objective robust optimisation in bioprocessing with conformalised
      quantile regression as interval-based surrogate models
    authors: [Pham, Tien Dung, Bassett, Robert, Aickelin, Uwe]
    year: 2025
    venue: Optimization Letters (online first, 2025-09-24)
    location: https://doi.org/10.1007/s11590-025-02239-9
    accessed: 2026-08-21
    stability: doi
    type: paper
    note: >-
      **The nearest published work to what engin-core does, and it reports the
      comparison going against us** (#266). Three bioprocess case studies —
      upstream glucose feed optimisation, univariate downstream affinity
      chromatography, multivariate cation-exchange chromatography — in which
      conformalised quantile regression surrogates outperform Gaussian-process
      regression in both maximin and minimax regret, *particularly when process
      uncertainty is high*. Case study 1 is engin-core's own application, and
      GPR is engin-core's estimator.

      **Engin has not run this comparison.** The row is `contested` rather than
      `contradicts` for that reason: it is an adverse in-domain result about the
      *estimator*, not a refutation of split conformal, which the paper uses
      rather than disputes. Running CQR against the GP on our own simulator and
      publishing whichever way it falls is #20 territory and is not done.

      **Verified independently rather than transcribed.** Crossref confirms the
      title, the three authors, Optimization Letters, published online
      2025-09-24, CC BY 4.0 (both `tdm` and `vor`), 67 references, and **no
      volume, issue or page numbers** — it is online-first, so any citation
      asserting them is unsupported. The case studies and the CQR-over-GPR
      conclusion are the paper's own abstract.

      **Two details this row deliberately does not assert**, because the
      publisher gated the full text and they could not be checked at source: that
      the conformalisation is done with MAPIE's `MapieRegressor` (which would put
      the result on engin-core's own conformal library), and that Bassett is at
      CSL Innovation. Both are reported in #266 and both are plausible; neither
      is carried here as a claim. If someone reaches the PDF, they are worth
      adding.

