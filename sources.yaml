  - doc: packages/engin-host/src/engin_host/scoring.py
    tier: A
    source_id: 2026-scikit-criteria
    claim: >-
      scikit-criteria propagates per-criterion uncertainty, and supports
      hard-constraint demotion.
    strength: contradicts
    reviewed: 2026-08-13
    note: >-
      Evaluated at 0.10. `mkdm(matrix, objectives, weights=...)` is point-valued;
      `WeightedSumModel`'s source contains no reference to std, sigma, variance or
      uncertainty; and there is no constraint or feasibility concept. Same verdict
      as pymcdm.

      **The honest reading of both, and the reason this row is worth keeping.**
      The weighted sum itself *is* a commodity and both libraries provide it --
      but it is also one line of numpy, and it is not the part that was hard. What
      neither provides is the uncertainty propagation or the demotion, which is
      the whole of what `scoring.py` adds. So "compose, don't reimplement" would
      here mean taking a dependency for the trivial half and still writing the
      other half. Rejection recorded with what was run: signatures inspected,
      `WeightedSumModel` source read, and the installed trees grepped for
      propagation and uncertainty. Re-check if either library gains stochastic or
      interval-valued inputs.

