# Engin evidence register (public half) — implements D23.
#
# Source of truth. Every markdown view is generated from this file:
#   python scripts/evidence/render.py            # writes docs/references.md
#   python scripts/evidence/render.py --check    # CI: fails if the view is stale
#
# The private half is sources.vault.yaml in the vault, holding Tier B/C rows only
# and sharing this id namespace. **A public citation must never resolve to a
# private path**; render.py enforces that rather than trusting it.
#
# `strength: contradicts` and `superseded` rows are the point of the exercise,
# not a failure of it. They become edits to the document, and the row stays as
# the record of the correction.
#
# ---------------------------------------------------------------------------
# Two open cadence questions, recorded here because DECISIONS.md is canonical
# and neither is settled. D23 sets one re-check interval for everything; these
# are the two classes where a calendar looks like the wrong instrument.
#
# 1. **API-behaviour rows expire on a release, not a date.** Four rows evidence
#    what a library's API does *today*: 2026-frictionless-detector,
#    2026-cf-xarray-units, 2026-pymcdm-methods, 2026-scikit-criteria. #127
#    proposes moving them onto the quarterly `stability: url` liveness sweep.
#    The MAPIE component row is the argument for it: it spent a year evidencing
#    a cross-check against a preprint whose API had since been renamed.
#
# 2. **Absence claims about a consolidating field.** #115 raises the same
#    question from the other side -- a vocabulary layer consolidates once, and
#    an annual clock can put you eighteen months behind. PREFER was six months
#    old when the D11 search missed it.
#
# Both are D23 amendments and the founder's call. Worth settling in one
# amendment rather than separately, since they are the same argument.
#
# **One row is deliberately absent**: docs/limitations.md's "raw material is
# ~2% of modelled cost" has no claim row yet, and that is a hold rather than an
# oversight. #122 argues the limitation is measured against the wrong end of
# D13's own continuum. Filing a `supports` row against Konzock now would codify
# a framing another open issue disputes, and a row asserting a claim is settled
# while it is under argument is worse than no row.
# ---------------------------------------------------------------------------

