claims:
  - doc: DECISIONS.md
    tier: A
    source_id: 2024-konzock-try-costs
    claim: >-
      Titer is an integrative metric that "does not say much about either the
      performance of the cell factory or the fermentation process" — D13's
      central argument, in the source's own words.
    strength: supports
    reviewed: 2026-08-11

  - doc: DECISIONS.md
    tier: A
    source_id: 2024-konzock-try-costs
    claim: >-
      TRY maps onto cost centres: titer to downstream processing (a low titer
      "may cause challenges in the downstream processing"), yield to substrate
      cost, which it "directly defines", and rate to reactor scale.
    strength: supports
    reviewed: 2026-08-11

  - doc: DECISIONS.md
    tier: A
    source_id: 2024-konzock-try-costs
    claim: >-
      "Media is roughly 35-50% of precision-fermentation cost of goods, ahead of
      facility depreciation (20-25%) and downstream processing (15-20%)."
    strength: contested
    reviewed: 2026-08-11
    note: >-
      The source supports the *direction* — substrate cost is set by yield and
      dominates — but not these figures. It says substrate "can account for more
      than 50% of the total costs" for *commodity products such as ethanol*,
      which is a different product class and a different number. The 35-50%
      split traces to industry blog material, not to a peer-reviewed
      breakdown for precision fermentation. Corrected in the documents
      2026-08-11: the direction is kept and cited, the invented precision
      dropped.
  - doc: docs/benchmarks.md
    tier: A
    source_id: 2025-zenodo-erythromycin-efp
    claim: >-
      406 industrial fed-batch production batches, hourly, with a
      product-potency target, licensed CC-BY-4.0.
    strength: supports
    reviewed: 2026-08-11

  - doc: docs/methods/real-data-calibration.md
    tier: A
    source_id: 2025-sun-master-efp
    claim: >-
      `hx` is the dataset's target column (chemical potency) — taken from the
      authors' own run_EFP.py, which defaults --target to hx.
    strength: supports
    reviewed: 2026-08-11

  - doc: docs/methods/real-data-calibration.md
    tier: A
    source_id: 2025-sun-master-efp
    claim: >-
      The dataset's authors report considerably better prediction than this
      baseline using an architecture built for the purpose.
    strength: partially supports
    reviewed: 2026-08-11

  - doc: packages/engin-core/src/engin_core/gp.py
    tier: A
    source_id: 2002-papadopoulos-inductive-confidence
    claim: >-
      `split_conformal_multiplier` implements the classical normalized
      nonconformity measure R_i = |y_i - yhat_i| / sigma_i.
    strength: supports
    reviewed: 2026-08-13
    note: >-
      Attribution corrected 2026-08-13. Three places said "Papadopoulos,
      Gammerman and Vovk", dropping Proedrou and reordering the rest. The paper
      is Papadopoulos, Proedrou, Vovk and Gammerman (2002). A citation that names
      the wrong author set is not a small thing in a register whose entire
      purpose is that claims resolve.

  - doc: docs/methods/conformal-calibration.md
    tier: A
    source_id: 2018-lei-distribution-free
    claim: >-
      Split conformal has a finite-sample, distribution-free coverage guarantee.
    strength: supports
    reviewed: 2026-08-13

  - doc: docs/methods/conformal-calibration.md
    tier: A
    source_id: 2021-angelopoulos-gentle-intro
    claim: >-
      The conformal guarantee is *marginal* — average coverage over the joint
      distribution — and conditional coverage is unattainable distribution-free
      without further assumptions.
    strength: supports
    reviewed: 2026-08-13
    note: >-
      **The finding of this pass.** The word "marginal" appeared nowhere in the
      conformal documentation or in gp.py before 2026-08-13 — only in "log
      marginal likelihood", which is unrelated. Meanwhile the out-of-distribution
      page reports coverage broken down by region, which is exactly the
      after-the-fact subgroup the theorem does not cover. Nothing measured was
      wrong; what was missing was the sentence stopping a reader from taking
      "90% coverage, distribution-free" as "90% wherever I ask". Added to both
      pages and to the function's docstring.

  - doc: docs/methods/conformal-calibration.md
    tier: A
    source_id: 2019-tibshirani-covariate-shift
    claim: >-
      Covariate shift violates exchangeability, and the literature has a weighted
      conformal treatment for it that Engin does not implement.
    strength: supports
    reviewed: 2026-08-13
    note: >-
      Cited for what Engin does *not* do. The page said the guarantee assumes
      exchangeability and that covariate shift breaks it, but left the impression
      this was an open problem. It is not — it is an unimplemented one here.

  - doc: docs/methods/conformal-calibration.md
    tier: A
    source_id: 2023-barber-beyond-exchangeability
    claim: >-
      The non-exchangeable case has published bounds on the coverage gap.
    strength: supports
    reviewed: 2026-08-13
    note: >-
      Same purpose as the row above: the honest statement is that Engin uses
      unweighted split conformal and reports where it degrades, which is weaker
      than the field's position and is now said outright rather than implied.

  - doc: DECISIONS.md
    tier: A
    source_id: 2011-straathof-downstream-costs
    claim: >-
      Downstream processing is 45-92% of production cost for biopharmaceuticals
      against a typical 20-40% for bulk fermentation products.
    strength: supports
    reviewed: 2026-08-13
    note: >-
      **Upgraded from `partially supports` the same day, on reading the primary
      source.** The founder purchased the chapter after this row was first filed
      against its abstract. Both figures verify verbatim: "For the analyzed
      biopharmaceutical processes, the range is 45-92%" and "for bulk
      fermentation products, the typical range is 20-40%." The chapter is
      copyrighted Elsevier material and is deliberately **not** committed to this
      repository (cf. D12's ship-no-data rule); the DOI is the pointer.

  - doc: DECISIONS.md
    tier: A
    source_id: 2011-straathof-downstream-costs
    claim: >-
      For bulk fermentation products, raw material takes a larger share of
      production cost than downstream processing does.
    strength: contradicts
    reviewed: 2026-08-13
    note: >-
      **Written 2026-08-13 from the abstract, corrected the same day from the
      chapter.** The source says carbohydrate feedstock is 15-60% of production
      cost and the most important *upstream* contributor -- but then: "only for
      the ethanol and penicillin processes analyzed, carbohydrate costs were
      larger than overall DSP costs." So substrate-beats-DSP is a statement about
      particular processes, not about bulk products as a class. The generalized
      version was mine, not the source's. Corrected in DECISIONS.md, README.md
