claims:

  # -- The scale-invariance limitation (#190). Both rows are `supports` for the
  # *editorial* claim that omitting oxygen is the omission that matters. Neither
  # supports a number: every figure in that section is measured on our own
  # simulator and marked `not-a-claim`.

  - doc: docs/limitations.md
    tier: A
    source_id: 2009-garcia-ochoa-otr-scaleup
    claim: >-
      "Oxygen transfer is the omission that makes the word scale-up unsupportable
      here" — the review states that oxygen transfer is often the rate-limiting
      step in aerobic bioprocesses and that measuring or predicting kLa is a
      crucial step in the design, operation and scale-up of bioreactors. Both are
      in the open abstract.
    strength: supports
    reviewed: 2026-08-18
    note: >-
      Deliberately *not* cited for the kLa exponent range (b about 0.4-0.8 on
      power-per-volume) that #190 attributes to its Table 2. That table is behind
      the paywall and was not read, so the section makes the weaker qualitative
      claim -- kLa is set by power input, gas flow and broth properties rather
      than by volume -- which the abstract does support.

  - doc: docs/limitations.md
    tier: A
    source_id: 2014-schaepe-overfeeding
    claim: >-
      "In a real vessel induction_time tightens the feasible feed_rate, while this
      model treats the two knobs as independent" — the abstract states that
      heterologous protein production causes a substantial decrease in the maximal
      specific oxygen uptake rate, and that in high-cell-density cultures the
      substrate feed rate must be adapted to the cells' changing capabilities to
      avoid overfeeding and inhibitory by-products.
    strength: supports
    reviewed: 2026-08-18

