# One row per major code component. `stance: unaudited` is the honest default
# and is what the D23 programme exists to reduce — see issues #84 to #90.
components:
  - component: Gaussian-process titer forecast
    package: engin-core
    stance: standard
    standard_impl: scikit-learn GaussianProcessRegressor
    evidence: [2011-pedregosa-scikit-learn]
    adr: adr/0002-light-default-dependency-path
    reviewed: 2026-08-13
    note: >-
      scikit-learn is the standard general-purpose ML library, and that is what
      the citation supports. It is *not* the standard for GPs specifically --
      GPyTorch and GPy are the specialist implementations, and a scalable or
      deep-kernel GP would use one of them. The stance is `standard` because
      ADR 0002 chose the light dependency path deliberately, not because
      sklearn's GP is the field's best GP.

  - component: Split-conformal calibration
    package: engin-core
    stance: wrapped
    standard_impl: MAPIE (cross-check) + sd-normalized multiplier
    evidence: [2022-taquet-mapie]
    adr: null
    reviewed: 2026-08-13
    note: >-
      MAPIE is the widely-used Python conformal library and is kept here as an
      independent cross-check, not as the default -- it is deliberately a
      *different* method (constant-width), which is the point of a cross-check.
      Recorded absence: MAPIE has a preprint and no peer-reviewed publication.
      The underlying method's grounding is #86, a separate question from the
      library's.

  - component: Data convention over xarray/pandas
    package: engin-core
    stance: bespoke-justified
    standard_impl: MIFE / MIFD (metadata layer)
    evidence: [2026-cf-xarray-units, 2026-georgakilas-mife-mifd, 2026-amigo-prefer]
    adr: null
    reviewed: 2026-08-14
    note: >-
      **`standard_impl: none exists` was false, and this project's own decision
      record already said so.** MIFE and MIFD -- minimum information for
      fermentation experiments and devices -- are peer-reviewed (GigaScience 2026),
      LinkML-schema'd, deposited in BioPortal and integrated with FAIR Data
      Station. The vault's D11 entry names them and resolves to *adopt rather than
      compete*, on the reasoning that where a standard exists the durable position
      is the reference implementation. The public register meanwhile claimed the
      slot was empty.

      **Resolved 2026-08-13**: `convention.MIFE_SLOTS` maps all 17 channels to a
      MIFE slot (9) or a documented gap (8), with tests failing if a channel is
      added without a verdict. The boundary is real rather than convenient -- MIFE
      specifies controlled conditions and provenance; this convention adds measured
      and derived series, and MIFE defines no slot for OUR, CER, RQ, kLa, mu,
      cultivation biomass or exhaust composition. Those are exactly the channels a
      real industrial export forced in and a simulator never needed. Generating the
      data model from the LinkML spec remains outstanding; see
      docs/design/data-convention.md.

      **Re-searched 2026-08-14 (#115).** PREFER, a BFO-aligned precision-fermentation
      ontology out of DTU and UCSD, published 2026-02-18 -- six months before the
      search above ran, and missed by it. Verdict `monitor`: a different layer
      (semantics, not a minimum-information checklist), no adoption evidence yet. It
      does not cite MIFE/MIFD, which is the fragmentation D11 named, and is the
      finding to report upstream. The re-check is pulled in to 2027-02; whether
      annual is the wrong cadence for standards claims generally is D23's call.

  - component: Ingest layer / schema inference
    package: engin-core
    stance: bespoke-justified
    standard_impl: none exists for the inference step; MIFE/MIFD is the target vocabulary
    evidence: [2026-frictionless-detector, 2026-georgakilas-mife-mifd]
    adr: null
    reviewed: 2026-08-13
    note: >-
      The absence survives here, but narrower than it was stated. Nothing
      published maps arbitrary vendor bioreactor exports onto a domain vocabulary
      -- frictionless infers *types*, not semantics, which is why it was rejected.
      What changed on 2026-08-13 is the other end: **the vocabulary to map onto is
      no longer ours to invent.** MIFE/MIFD supplies it, so the honest description
      of this component is a mapper into a published standard rather than a
      standard-shaped gap.

  - component: Techno-economic coupling
    package: engin-core
    stance: standard
    standard_impl: BioSTEAM (behind the [tea] extra)
    evidence: [2020-cortespena-biosteam]
    adr: null
    reviewed: 2026-08-13
    note: >-
      BioSTEAM is the open, peer-reviewed platform for biorefinery TEA under
      uncertainty, which is exactly the thing D8 declines to rebuild. Note the
      dependency is real but *optional* (the [tea] extra, Python 3.12+): the
      front page claimed a firmer coupling than exists until corrected
      2026-08-13.

  - component: Mechanistic fed-batch simulator
    package: engin-core
    stance: bespoke-justified
    standard_impl: SBML + COPASI / libRoadRunner (representation and simulation)
    evidence: [2003-hucka-sbml]
    adr: null
    reviewed: 2026-08-13
    note: >-
      Audited for #84. "None claimed" was wrong: kinetic models of this shape have
      a standard *representation* (SBML) and standard simulators (COPASI,
      libRoadRunner, Tellurium), and D9 requires naming them rather than treating
      the slot as empty. Bespoke is still right, for a reason worth stating: this
      is a deliberately caricatured Monod / Luedeking-Piret model whose job is to
      be a legible teaching and benchmark fixture, not a research kinetic model.
      Expressing it in SBML would add a toolchain to gain portability nobody
      needs for a fixture, and the integrator is already scipy's `solve_ivp`
      rather than a hand-rolled RK4 -- the part that genuinely should not be
      reinvented is not. **Revisit the moment a user's own kinetics need to go in:
      at that point SBML import stops being overhead and starts being the
      feature.**

  - component: Expected-improvement recommender
    package: engin-core
    stance: bespoke-justified
    standard_impl: BoTorch / Ax / BayBE
    evidence: [2020-balandat-botorch]
    adr: adr/0002-light-default-dependency-path
    reviewed: 2026-08-13
    note: >-
      Reclassified from `unaudited`. BoTorch is the reference implementation for
      Monte-Carlo BO and BayBE is a well-built Apache-2.0 campaign layer
      (verified 2026-08-13: Apache-2.0, maintained by Merck KGaA, 0.15.0 released
      2026-06-11). Engin ships a thin analytic EI on its own GP instead, and the
      justification is ADR 0002 -- adopting BoTorch drags PyTorch into the
      default install. That is a dependency-weight argument, not a claim to a
      better acquisition function, and it should never be written as one.

  - component: Host-capability knowledge base and scoring
    package: engin-host
    stance: bespoke-justified
    standard_impl: pymcdm / scikit-criteria (weighted-sum MCDA)
    evidence: [2026-pymcdm-methods, 2026-scikit-criteria]
    adr: null
    reviewed: 2026-08-13
    note: >-
      **The one row this audit could not clear, and it is filed as such.**
      `standard_impl: unknown` was not true. `scoring.py` is a weighted-sum
      multi-criteria decision analysis with linear error propagation -- a named
      method in a mature field, with maintained Python implementations (pymcdm
      1.4.0, scikit-criteria 0.10, both verified on PyPI 2026-08-13). Neither was
      evaluated before this was written, and D9's rule that "the rejection needs
      evidence too" was not met.

      The knowledge base and its capability semantics are genuinely bespoke
      domain content and were never in question. What was in question is the ~40
      lines of scoring arithmetic on top.

      **Resolved 2026-08-13 by running the evaluation (#103), not by arguing it.**
      pymcdm 1.4.0 and scikit-criteria 0.10 were installed and inspected: both
      take point-valued decision matrices, neither propagates a per-criterion
      standard deviation, and neither has any feasibility or constraint concept.
      Both of this component's requirements are unmet, so the row moves to
      `bespoke-justified` -- see the two claim rows above for what was run.

      Note what the evaluation did *not* vindicate: the weighted sum itself is a
      commodity and both libraries provide it. It is also one line of numpy. The
      justification rests entirely on the uncertainty propagation and the
      demotion, and if either library gains interval-valued or stochastic inputs
      this should be revisited rather than assumed settled.

  - component: Route-as-graph embedding
    package: engin-pathway
    stance: bespoke-justified
    standard_impl: PyTorch Geometric (M1 upgrade)
    evidence: [2019-fey-pytorch-geometric]
    adr: adr/0002-light-default-dependency-path
    reviewed: 2026-08-13
    note: >-
      PyG is the standard GNN framework and the cited paper is its own
      publication. What ships today is a *random-weight* GCN stand-in (M0), not a
      trained model, and ADR 0002 is the justification for not pulling torch yet.
      No PyG-versus-DGL performance comparison is made anywhere in this
      repository, and none should be added without a dated, version-pinned
      benchmark: a "~30% faster than DGL" claim was asserted and withdrawn in the
      private notes on 2026-08-10 after tracing to no source, and that is the
      class of claim #85 exists to stop.

  - component: Protein fitness ridge head
    package: engin-protein
    stance: standard
    standard_impl: ridge regression on one-hot / physicochemical features
    evidence: [2022-hsu-protein-fitness-baselines, 2021-biswas-low-n]
    adr: null
    reviewed: 2026-08-13
    note: >-
      Cleared by #89. The estimator *is* the field's standard baseline for this
      regime rather than a shortcut around one: Hsu et al. (2022) find simple
      regression baselines competitive with or better than sophisticated methods
      for fitness prediction, and Biswas et al. (2021) fix "low-N" at tens of
      assayed variants. The switch condition to something richer is epistasis,
      not sample size -- see the model docstring.

  - component: Monomer featurization
    package: engin-materials
    stance: bespoke-justified
    standard_impl: none applicable (RDKit was a category error)
    evidence: [2026-rdkit-descriptors]
    adr: null
    reviewed: 2026-08-13
    note: >-
      Audited for #84, and the row was wrong twice over. There is no
      `featurize.py` in this package -- featurization is `Unit.vector()` in
      `schema.py`, which the row should name. And **RDKit is not the standard
      implementation of it, because RDKit computes descriptors from chemical
      structures and this package has none**: a `Unit` is an abstract monomer
      carrying hand-specified goodness scores, not a molecule. Naming RDKit here
      implied a cheminformatics pipeline that does not exist and was never
      intended. If real monomer chemistry is ever ingested, RDKit becomes the
      right answer and this row should flip; today it is a category error left
      over from planning.

