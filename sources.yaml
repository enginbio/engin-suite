claims:
  - doc: DECISIONS.md
    tier: A
    source_id: 2024-konzock-try-costs
    claim: >-
      Titer is an integrative metric that "does not say much about either the
      performance of the cell factory or the fermentation process" — D13's
      central argument, in the source's own words.
    strength: supports
    reviewed: 2026-08-11

  - doc: DECISIONS.md
    tier: A
    source_id: 2024-konzock-try-costs
    claim: >-
      TRY maps onto cost centres: titer to downstream processing (a low titer
      "may cause challenges in the downstream processing"), yield to substrate
      cost, which it "directly defines", and rate to reactor scale.
    strength: supports
    reviewed: 2026-08-11

  - doc: DECISIONS.md
    tier: A
    source_id: 2024-konzock-try-costs
    claim: >-
      "Media is roughly 35-50% of precision-fermentation cost of goods, ahead of
      facility depreciation (20-25%) and downstream processing (15-20%)."
    strength: contested
    reviewed: 2026-08-11
    note: >-
      The source supports the *direction* — substrate cost is set by yield and
      dominates — but not these figures. It says substrate "can account for more
      than 50% of the total costs" for *commodity products such as ethanol*,
      which is a different product class and a different number. The 35-50%
      split traces to industry blog material, not to a peer-reviewed
      breakdown for precision fermentation. Corrected in the documents
      2026-08-11: the direction is kept and cited, the invented precision
      dropped.
  - doc: docs/benchmarks.md
    tier: A
    source_id: 2025-zenodo-erythromycin-efp
    claim: >-
      406 industrial fed-batch production batches, hourly, with a
      product-potency target, licensed CC-BY-4.0.
    strength: supports
    reviewed: 2026-08-11

  - doc: docs/methods/real-data-calibration.md
    tier: A
    source_id: 2025-sun-master-efp
    claim: >-
      `hx` is the dataset's target column (chemical potency) — taken from the
      authors' own run_EFP.py, which defaults --target to hx.
    strength: supports
    reviewed: 2026-08-11

  - doc: docs/methods/real-data-calibration.md
    tier: A
    source_id: 2025-sun-master-efp
    claim: >-
      The dataset's authors report considerably better prediction than this
      baseline using an architecture built for the purpose.
    strength: partially supports
    reviewed: 2026-08-11

  - doc: BIOSECURITY.md
    tier: A
    source_id: 2024-responsible-biodesign-statement
    claim: >-
      The statement identifies nucleic acid synthesis as the key biosecurity
      checkpoint for computational biodesign, on the reasoning that no designed
      construct causes physical harm until it is manufactured.
    strength: supports
    reviewed: 2026-08-13

  - doc: BIOSECURITY.md
    tier: A
    source_id: 2024-responsible-biodesign-statement
    claim: >-
      The statement is "supported by IBBIS, NTI | bio, the International Gene
      Synthesis Consortium and others."
    strength: contradicts
    reviewed: 2026-08-13
    note: >-
      The source says the opposite, twice: affiliations "are for identification
      only and do not imply any institutional endorsement." Signatories sign as
      individuals. The count is also a moving figure -- 189 as of 2026-02-06 on a
      list still open -- against a statement released 2024-03-08. Corrected
      2026-08-13: the endorsement claim is withdrawn and the count is dated. A
      biosecurity policy borrowing institutional authority it was never granted
      is the worst place in this repository for this class of error.

  - doc: BIOSECURITY.md
    tier: A
    source_id: 2019-steen-uncultured-majority
    claim: >-
      Most bacterial and archaeal taxa across most biomes remain uncultured, so
      cultivation is a genuine barrier -- BIOSECURITY.md section 6's premise.
    strength: supports
    reviewed: 2026-08-13

  - doc: BIOSECURITY.md
    tier: A
    source_id: 2019-martiny-culturable
    claim: >-
      Roughly half of sequences and a third of taxa across major biomes have a
      closely related cultured relative, which would make the cultivation
      barrier smaller than section 6 assumed.
    strength: contradicts
    reviewed: 2026-08-13
    note: >-
      A live disagreement in the primary literature: Steen et al. is a direct
      rebuttal of this paper, in the same journal and year. Section 6 stated the
      majority view as settled; it now states both and notes which way the
      disagreement cuts. It cuts *against* our own safeguard's necessity, which
      is the reason to publish it rather than the reason to omit it. The
      safeguard is unchanged -- a contested barrier is not an absent one.

  - doc: docs/benchmarks.md
    tier: A
    source_id: 2019-goldrick-indpensim
    claim: >-
      IndPenSim is a simulation validated against industrial data, not
      measurements from a real plant — placing it at D12 tier 2, not tier 3.
    strength: supports
    reviewed: 2026-08-11

  - doc: packages/engin-core/src/engin_core/loaders.py
    tier: A
    source_id: 2026-frictionless-detector
    claim: >-
      frictionless `field_confidence` is a type-casting tolerance, not semantic
      confidence, and it maps nothing to a domain vocabulary — so it does not
      serve D11's ingest need.
    strength: supports
    reviewed: 2026-08-11

  - doc: packages/engin-core/src/engin_core/convention.py
    tier: A
    source_id: 2026-cf-xarray-units
    claim: >-
      cf_xarray's vocabulary is geoscience-specific and reports n/a across the
      board on bioprocess data, so the CF *mechanism* was adopted and the
      package was not.
    strength: supports
    reviewed: 2026-08-11

  - doc: DECISIONS.md
    tier: A
    source_id: 2026-numfocus-fiscal-sponsorship
    claim: >-
      NumFOCUS fiscal sponsorship requires a leadership body of at least three
      people not sharing a common affiliation, an OSI licence, a Code of
      Conduct, and an active community of reasonable size (D25).
    strength: supports
    reviewed: 2026-08-11

