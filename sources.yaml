  - id: 2024-wilson-probabilistic-regret-bounds
    title: Stopping Bayesian Optimization with Probabilistic Regret Bounds
    authors: [Wilson, James T.]
    year: 2024
    venue: arXiv (stat.ML)
    location: https://doi.org/10.48550/arXiv.2402.16811
    accessed: 2026-08-17
    stability: doi
    type: preprint
    note: >-
      Single author. Any prose here that says "Wilson et al." would be wrong, and
      #251 flagged it as a live risk in this module's framing.

      Worth recording what this paper does **not** license, since `stopping.py`
      cites it for the (epsilon, delta) framing: Wilson draws joint sample paths
      via Matheron's rule and maximizes each draw. He never takes a product over a
      discretized candidate set, and explicitly avoids marginalizing -- *"We opted
      to avoid these issues by sampling f_t(x) jointly with f*_t rather than
      marginalizing it out."* The independence product this module used until
      2026-08-20 was not his construction.

