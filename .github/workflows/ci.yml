name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/engin-core[dev]" -e "packages/engin-host[dev]" -e "packages/engin-pathway[dev]"
      - name: Lint
        run: ruff check .
      - name: Test engin-core
        working-directory: packages/engin-core
        run: pytest -q
      - name: Test engin-host
        working-directory: packages/engin-host
        run: pytest -q
      - name: Test engin-pathway
        working-directory: packages/engin-pathway
        run: pytest -q
      - name: Benchmarks (smoke)
        working-directory: packages/engin-core
        run: python benchmarks/benchmark.py
