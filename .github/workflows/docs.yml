# Building the docs executes every example (MyST-NB, nb_execution_raise_on_error),
# so this workflow is simultaneously the docs build and the examples test suite --
# a broken example fails CI. That is D15: documentation that cannot silently rot.
#
# It runs on pull requests too, so a PR that breaks an example is caught before
# merge rather than after.
#
# Hosting is Read the Docs (D20), which builds from .readthedocs.yaml. This
# workflow does not deploy; it enforces that the build is green and the examples
# run, on controlled resources rather than RTD's shared builders.

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, for the cache-freshness job below only. That job rebuilds from an
  # empty cache, which executes every page -- too slow to put on a pull request,
  # and pointless there anyway: it detects code drifting away from a cached
  # output over time, which is a calendar problem, not a per-change one.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      # -W turns warnings into errors: a dead cross-reference is a broken promise
      # on a site whose argument is that its documentation is trustworthy.
      # --keep-going reports every problem rather than stopping at the first.
      # Runs FIRST, deliberately: it builds against the cache exactly as committed,
      # before the step below refreshes it. Two things are checked at once.
      #
      # 1. Read the Docs builds under materially different settings from CI, and
      #    is not a required check -- so for three merges it failed while every PR
      #    showed green and the published site served a stale page. This
      #    reproduces its environment so that breakage blocks a merge.
      # 2. The committed execution cache is current. RTD renders example outputs
      #    from it instead of executing (D20); if it were stale, RTD would quietly
      #    fall back to *executing* on shared builders -- the thing D20 exists to
      #    prevent. A cache hit logs "Using cached notebook"; a miss logs
      #    "Executing notebook", which is what this fails on.
      - name: Verify Read the Docs renders from the committed cache
        env:
          READTHEDOCS: "True"
          READTHEDOCS_CANONICAL_URL: https://docs.engin.bio/en/latest/
        run: |
          set -o pipefail
          sphinx-build -W --keep-going -b html docs docs/_build/rtd 2>&1 | tee rtd-build.log
          if grep -q "Executing notebook" rtd-build.log; then
            echo "::error::The committed docs execution cache is stale, so Read the Docs would"
            echo "::error::execute notebooks on its shared builders instead of rendering from"
            echo "::error::the cache (D20). Rebuild the docs locally and commit the refreshed"
            echo "::error::docs/.jupyter_cache:  sphinx-build -b html docs docs/_build/html"
            exit 1
          fi

      # sources.yaml is the source of truth and docs/references.md is generated from
      # it. A hand-edited view, or one left stale after a register change, makes the
      # published citations say something the register does not (D23).
      - name: Verify the evidence register and its rendered view
        run: python scripts/evidence/render.py --check

      # D23's mechanism. Under a solo maintainer a review cadence decays and a
      # failing check does not -- without this, the register is a more ceremonious
      # hand-maintained table. Every finding is clearable four ways, one of which
      # is saying out loud that the number is a fact about this repository.
      - name: Fail on uncited claims in Tier A documents
        run: python scripts/evidence/check_claims.py

      # D23's third mechanism. The gate above catches an *uncited* claim; this
      # catches a *retracted* one that is still published somewhere else. Three
      # times in one week a correction reached one canonical document and not the
      # documents repeating it, and all three were found by accident. DECISIONS.md
      # already gives the instruction -- "grep the tree for the phrase, not the
      # decision id" -- so this is that instruction run by CI instead of memory.
      - name: Fail on retracted claims still published
        run: python scripts/evidence/check_corrections.py

      - name: Build (warnings are errors, examples execute)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 14

  # The `build` job's cache check greps for "Executing notebook" and so detects a
  # cache *miss*. It cannot detect a hit on *stale* content, which is the worse
  # case: jupyter-cache keys on a hash of the cell source, so a cell whose text
  # never changes keeps hitting after the code it imports has moved underneath it.
  #
  # That is not hypothetical. docs/guides/data-formats.md published 13 of 17
  # registered channels for five days with every check green, because the cell
  # that prints them was unchanged while engin_core.convention was not (#155).
  #
  # The only way to tell a stale hit from an accurate one is to run the cells, so
  # this rebuilds from an empty cache and compares. It is scheduled rather than
  # per-PR: a cold build executes every page, and the drift it looks for happens
  # over weeks. It is deliberately NOT a required check -- it reports a fact about
  # main, and blocking merges on a weekly job would be the wrong trade (#166).
  cache-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Rebuild from an empty cache and compare
        run: |
          set -o pipefail
          cp -r docs/.jupyter_cache "$RUNNER_TEMP/committed-cache"
          rm -rf docs/.jupyter_cache
          sphinx-build -W --keep-going -b html docs docs/_build/cold
          python scripts/evidence/check_cache_fresh.py \
            "$RUNNER_TEMP/committed-cache" docs/.jupyter_cache

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The committed execution cache no longer matches what the code"
          echo "::error::produces, so the published docs show stale output. Rebuild and"
          echo "::error::commit the refreshed cache:"
          echo "::error::  sphinx-build -b html docs docs/_build/html && git add docs/.jupyter_cache"


  # GOVERNANCE.md 5.4, docs/install.md and docs/index.md each describe which
  # `engin-*` names are held on PyPI. That paragraph has been wrong four times
  # (#269), every time because the index moved and the prose did not. This checks
  # the live index against the names discovered from packages/*/pyproject.toml,
  # so the two cannot silently disagree.
  #
  # Scheduled rather than per-PR, on the same reasoning as cache-freshness above
  # (#166): the drift is a calendar problem, not a per-change one -- the index
  # moves independently of pull requests. Making it a required check would also
  # put pypi.org's availability in front of every merge, which is a bad trade for
  # a fact that changes a few times a year.
  #
  # Read-only and unauthenticated. `--verify` treats an unreachable index as
  # unknown rather than unclaimed, so an outage reports and does not fail.
  pypi-names:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Live index matches what the documents claim
        run: python scripts/pypi/reserve_names.py --verify
