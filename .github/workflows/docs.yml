# Building the docs executes every example (MyST-NB, nb_execution_raise_on_error),
# so this workflow is simultaneously the docs build and the examples test suite --
# a broken example fails CI. That is D15: documentation that cannot silently rot.
#
# It runs on pull requests too, so a PR that breaks an example is caught before
# merge rather than after.
#
# Hosting is Read the Docs (D20), which builds from .readthedocs.yaml. This
# workflow does not deploy; it enforces that the build is green and the examples
# run, on controlled resources rather than RTD's shared builders.

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write, not read: pushes to main refresh the committed jupyter-cache that
  # Read the Docs renders from. Pull requests do not reach that step.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      # -W turns warnings into errors: a dead cross-reference is a broken promise
      # on a site whose argument is that its documentation is trustworthy.
      # --keep-going reports every problem rather than stopping at the first.
      - name: Build (warnings are errors, examples execute)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      # Read the Docs builds under materially different settings from the step
      # above, and RTD is not a required check -- so for three merges it failed
      # while every PR showed green and the published site served a stale page.
      # This reproduces RTD's environment so that class of breakage blocks a
      # merge instead of being discovered on the live site.
      - name: Build as Read the Docs builds it
        env:
          READTHEDOCS: "True"
          READTHEDOCS_CANONICAL_URL: https://docs.engin.bio/en/latest/
        run: sphinx-build -W --keep-going -b html docs docs/_build/rtd

      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html/
          retention-days: 14

      # RTD renders example outputs from this cache rather than executing them
      # (D20). It therefore has to be current in the repository, and the only
      # way that survives one maintainer is a machine keeping it current.
      # Pushes to main only: pull requests have no write access, and a
      # GITHUB_TOKEN-authored push does not retrigger workflows, so this cannot
      # loop.
      - name: Refresh the committed execution cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/.jupyter_cache; then
            echo "execution cache is current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.jupyter_cache
          git commit -m "Refresh the docs execution cache [skip ci]"
          git push
